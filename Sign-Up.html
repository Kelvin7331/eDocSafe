<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-DocSafe – Create Account</title>
  <!-- REMOVED: unused bcryptjs (Firebase handles password hashing server-side) -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <!-- Firebase SDK (REQUIRED - was missing, causing signup to fail entirely) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card fade-in">
      <h2><i class="fa-solid fa-user-plus"></i> Create Account</h2>
      <div id="signup-message" class="message" role="alert" aria-live="polite"></div>
      <form id="signup-form" novalidate>
        <label for="signup-name">Full Name <span aria-hidden="true">*</span></label>
        <input type="text" id="signup-name" placeholder="Enter your full name"
               required autocomplete="name">

        <label for="signup-email">Email <span aria-hidden="true">*</span></label>
        <input type="email" id="signup-email" placeholder="Enter your email"
               required autocomplete="email">

        <label for="signup-password">Password <span aria-hidden="true">*</span></label>
        <div class="password-container">
          <input type="password" id="signup-password" placeholder="Create a password"
                 required minlength="6" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="signup-password"
                  aria-label="Toggle password visibility">
            <i class="fas fa-eye" aria-hidden="true"></i>
          </button>
        </div>

        <label for="signup-confirm">Confirm Password <span aria-hidden="true">*</span></label>
        <div class="password-container">
          <input type="password" id="signup-confirm" placeholder="Re-enter password"
                 required minlength="6" autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="signup-confirm"
                  aria-label="Toggle confirm password visibility">
            <i class="fas fa-eye" aria-hidden="true"></i>
          </button>
        </div>

        <label class="terms">
          <input type="checkbox" id="agreeTerms" required>
          I agree to the <a href="Terms.html">terms &amp; conditions</a>.
        </label>

        <button type="submit" class="btn-primary">Sign Up</button>
      </form>

      <div class="footer">
        Already have an account? <a href="Sign-In.html">Sign In</a>
      </div>

      <!-- FIXED: consistent branding (was "iNet" here, "iNex" on Sign-In) -->
      <p class="secured-tag">Secured by <strong>iNex</strong></p>
    </div>
  </div>

  <script src="auth.js" defer></script>
</body>
</html>
